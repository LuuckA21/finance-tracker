name: finance-tracker

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
    # No published port: the database is reachable only from the backend
    mem_limit: ${DB_MEMORY:-512m}
    pids_limit: 200

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Zurich}
      DB_URL: jdbc:postgresql://db:5432/finance
      DB_USERNAME: finance
      DB_PASSWORD: ${DB_PASSWORD}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_ADMIN_LANGUAGE: ${APP_ADMIN_LANGUAGE:-IT}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-2h}
      SESSION_MAX_LIFETIME: ${SESSION_MAX_LIFETIME:-7d}
      # Daily ECB exchange rates (outbound HTTPS to www.ecb.europa.eu)
      APP_ECB_ENABLED: ${APP_ECB_ENABLED:-true}
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # Heap is 75% of this (JAVA_TOOL_OPTIONS in the Dockerfile); each password hash needs ~19 MiB
    mem_limit: ${BACKEND_MEMORY:-768m}
    pids_limit: 500

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    environment:
      # IP or CIDR of the host running Nginx Proxy Manager: only its X-Forwarded-* are trusted
      FT_TRUSTED_PROXY: ${TRUSTED_PROXY:?Set TRUSTED_PROXY in .env (IP of Nginx Proxy Manager)}
      NGINX_ENVSUBST_FILTER: "FT_"
    ports:
      # NPM runs on another host, so publish on this server's LAN address (never 0.0.0.0)
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8088}:8080"
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: ${WEB_MEMORY:-64m}
    pids_limit: 100

networks:
  internal:

volumes:
  db-data:

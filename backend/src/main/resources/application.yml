spring:
  application:
    name: finance-tracker
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finance}
    username: ${DB_USERNAME:finance}
    password: ${DB_PASSWORD:finance}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 */10 * * * *"
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # CSV import (CashEntryCsvService.MAX_BYTES); Nginx allows 4 MB on the import paths only
      max-file-size: 2MB
      max-request-size: 3MB
      # Keep uploads in memory: nothing is written to /tmp
      file-size-threshold: 3MB

server:
  port: 8080
  shutdown: graceful
  # Behind Nginx: trust X-Forwarded-* so request.getRemoteAddr() and isSecure() are correct
  forward-headers-strategy: native
  servlet:
    session:
      # Idle timeout of a login session
      timeout: ${SESSION_TIMEOUT:2h}
      cookie:
        name: ${SESSION_COOKIE_NAME:FT_SESSION}
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: strict
        path: /
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

app:
  # Name shown in authenticator apps
  totp-issuer: ${APP_TOTP_ISSUER:Finance Tracker}
  # Address users open the app at, e.g. https://finanze.example.com: passkeys are bound to its
  # domain (and off while it is empty); emails link to it too
  public-url: ${APP_PUBLIC_URL:}
  # Base64-encoded 32-byte key used to encrypt TOTP secrets at rest. Generate with: openssl rand -base64 32
  encryption-key: ${APP_ENCRYPTION_KEY:}
  bootstrap-admin:
    username: ${APP_ADMIN_USERNAME:admin}
    # When empty, a random password is generated and printed once in the log
    password: ${APP_ADMIN_PASSWORD:}
    # Interface language of the first administrator and of their starting categories: IT, EN, DE or FR
    language: ${APP_ADMIN_LANGUAGE:IT}
  login:
    max-failed-attempts: 5
    lock-duration: 15m
    ip-max-attempts: 30
    ip-window: 15m
    mfa-timeout: 5m
  session:
    # A login ends after this time even if used continuously (idle timeout: server.servlet.session.timeout)
    max-lifetime: ${SESSION_MAX_LIFETIME:7d}
  fx:
    ecb:
      # Download the ECB euro reference rates (needs outbound HTTPS to www.ecb.europa.eu).
      # Users' own rates always take priority over them.
      enabled: ${APP_ECB_ENABLED:true}
      base-url: https://www.ecb.europa.eu/stats/eurofxref/
      # Hourly check; a download happens only when a new publication is due (~16:00 CET)
      cron: "0 7 * * * *"
  mail:
    # SMTP server for the email notifications; leave the host empty to turn email off
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    # Sender, e.g. "Finanze <finanze@example.com>"
    from: ${MAIL_FROM:}
    # STARTTLS (port 587), SSL (port 465) or NONE (local relay only)
    security: ${MAIL_SECURITY:STARTTLS}
    # Public address of the app, linked from the emails (e.g. https://finanze.example.com)
    app-url: ${APP_PUBLIC_URL:}
    # Budget and goal alerts are checked every hour; the monthly summary goes out on the 1st
    cron: "0 20 * * * *"

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

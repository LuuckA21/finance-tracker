# Weekly update PRs; CI must pass before merging (review release notes for majors).
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      maven-minor:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  # Base images of the Dockerfiles (build and runtime stages)
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly

  # postgres image in docker-compose.yml. A major version needs a dump/restore, so only minors
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: postgres
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

name: Release

# Pushing a tag vX.Y.Z publishes the GitHub release, its notes taken from CHANGELOG.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, to check that the tagged commit is on master
          fetch-depth: 0
      - name: Check the tag and read the notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master \
            || { echo "$TAG is not on master: release from master only"; exit 1; }
          scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "Finanze $TAG" --notes-file "$RUNNER_TEMP/notes.md"
